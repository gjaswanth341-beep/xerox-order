<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xerox Order Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body { margin:0; font-family:'Poppins',sans-serif; background:#eef2f7; }
.page{position:absolute;width:100%;min-height:100vh;transition:all .5s}
.hidden{transform:translateX(100%);opacity:0}
.active{transform:translateX(0);opacity:1}
.container{text-align:center;padding:30px}
.card{background:#fff;border-radius:16px;padding:20px;margin:15px auto;max-width:350px;box-shadow:0 6px 18px rgba(0,0,0,.1);transition:.3s}
.card:hover{transform:translateY(-5px)}
button{padding:12px 16px;border:none;border-radius:10px;background:#2563eb;color:#fff;margin:8px;cursor:pointer;font-weight:500}
button:hover{background:#1e40af}
input{padding:10px;width:80%;border-radius:8px;border:1px solid #ccc}
img{max-width:250px;margin-top:10px;border-radius:10px}
.back{background:#9ca3af}
.success{font-size:22px;color:#16a34a;margin-top:20px}
</style>
</head>
<body>

<div class="page active" id="home">
<div class="container">
<h1>📘 Xerox Order</h1>
<input id="name" placeholder="Enter your name"><br>
<button onclick="nextHome()">Next</button>
</div></div>

<div class="page hidden" id="options"><div class="container">
<h2 id="welcome"></h2>
<div class="card"><h3>A4 ₹46</h3><button onclick="selectOption('A4')">Select</button></div>
<div class="card"><h3>A5 ₹72</h3><button onclick="selectOption('A5')">Select</button></div>
<button class="back" onclick="showPage('options','home')">Back</button>
</div></div>

<div class="page hidden" id="preview"><div class="container">
<h2 id="selectedText"></h2>
<img id="sampleImg">
<button onclick="goPayment()">Proceed</button>
<button class="back" onclick="showPage('preview','options')">Back</button>
</div></div>

<div class="page hidden" id="payment"><div class="container">
<h2>Choose Payment</h2>
<button onclick="scanPay()">Scan & Pay</button>
<button onclick="upiPay()">UPI App</button>
<button onclick="cod()">Cash on Delivery</button>
<button class="back" onclick="showPage('payment','preview')">Back</button>
</div></div>

<div class="page hidden" id="qrPage"><div class="container">
<h2>Scan QR</h2>
<img id="qrImg">
<button onclick="goUpload()">I Paid</button>
<button class="back" onclick="showPage('qrPage','payment')">Back</button>
</div></div>

<div class="page hidden" id="upload"><div class="container">
<h2>Upload Screenshot</h2>
<input type="file" id="file"><br>
<button onclick="submitOrder()">Submit</button>
<button class="back" onclick="showPage('upload','qrPage')">Back</button>
</div></div>

<div class="page hidden" id="done"><div class="container">
<h2 id="thanks"></h2>
<p class="success">Your name is listed ✅</p>
<p>Please click WhatsApp for further steps</p>
<button onclick="sendWhatsApp()">WhatsApp</button>
</div></div>

<script>
let name="",option="",payment="",imageURL="";
const sheetURL="https://script.google.com/macros/s/AKfycbzcWYeJBj7YllsEaES4Xp1SzzEklZG_xyfg9xba9ZhrHr7QAUDAtdH2UbySRf9BJP-w/exec";

function showPage(c,n){
 document.getElementById(c).classList.remove('active');
 document.getElementById(c).classList.add('hidden');
 document.getElementById(n).classList.remove('hidden');
 document.getElementById(n).classList.add('active');
}

function nextHome(){
 name=document.getElementById('name').value;
 if(!name) return alert('Enter name');
 document.getElementById('welcome').innerText="Welcome "+name;
 showPage('home','options');
}

function selectOption(o){
 option=o;
 document.getElementById('selectedText').innerText="You selected "+o;
 document.getElementById('sampleImg').src=o=='A4'?'images/a4.jpg':'images/a5.jpg';
 showPage('options','preview');
}

function goPayment(){ showPage('preview','payment'); }

function scanPay(){
 payment="Scan";
 document.getElementById('qrImg').src=option=='A4'?'images/a4qr.png':'images/a5qr.png';
 showPage('payment','qrPage');
}

function upiPay(){
 payment="UPI";
 let upiLink = option=='A4'
 ? "upi://pay?pa=7975918692@upi&pn=Xerox&am=46&cu=INR"
 : "upi://pay?pa=7975918692@upi&pn=Xerox&am=72&cu=INR";
 window.location.href = upiLink;
}

function cod(){
 payment="COD";
 finishDirect();
}

function goUpload(){ showPage('qrPage','upload'); }

function submitOrder(){
 let file = document.getElementById('file').files[0];
 if(!file){ alert("Please upload screenshot"); return; }
 uploadToDrive(file);
}

function uploadToDrive(file){
 let reader = new FileReader();
 reader.onload = function(){
 fetch(sheetURL, {
 method: "POST",
 body: JSON.stringify({
 name, option, payment,
 time:new Date().toLocaleString(),
 status:"Pending",
 fileData: reader.result,
 fileName: file.name
 })
 })
 .then(res=>res.text())
 .then(url=>{
 imageURL = url;
 finishAfterUpload();
 });
 };
 reader.readAsDataURL(file);
}

// FIXED FLOW
function finishAfterUpload(){
 document.getElementById('thanks').innerText="Thank you "+name;
 showPage('upload','done');
}

function finishDirect(){
 saveCOD();
 document.getElementById('thanks').innerText="Thank you "+name;
 showPage('payment','done');
}

function saveCOD(){
 fetch(sheetURL, {
 method: "POST",
 body: JSON.stringify({
 name, option, payment,
 time:new Date().toLocaleString(),
 status:"Pending"
 })
 });
}

function sendWhatsApp(){
 let msg=`Name:${name}%0AOption:${option}%0APayment:${payment}%0AScreenshot:${imageURL}`;
 window.open(`https://wa.me/917975918692?text=${msg}`);
}
</script>

</body>
</html>
